name: Prepare D431 UART probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    # Standard public runners have free minutes; artifact storage still has quotas.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      OUT: ${{ github.workspace }}/build/a13-ramdisk
      STOCK_IMAGE_SHA256: 14d41415663d4964e57ad17444806ae9019068b373afcebcc8699b76c2d11eb2
      OTA_URL: https://updates.cdn-apple.com/2026WinterFCS/patches/122-58491/9412B08D-D828-426C-BDCF-7FD42E2C83FC/com_apple_MobileAsset_SoftwareUpdate/89e2763cfd94578fea6621ec54ad0167d9a9f8bb.zip

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check image helper and non-mutating probe
        run: |
          python3 tools/test_a13_ramdisk.py
          cc -std=c11 -Wall -Wextra -Werror tools/test_a13_uart_probe.c -o "$RUNNER_TEMP/test-a13-uart-probe"
          "$RUNNER_TEMP/test-a13-uart-probe"

      - name: Install pinned native ipsw
        run: |
          mkdir -p "$OUT" "$RUNNER_TEMP/ipsw-tools"
          printf '%s\n' 'UNBOOTED UART CANDIDATE. D431 BOOTCHAIN/TRUSTCACHE NOT VALIDATED. DO NOT BOOT OR RESTORE.' > "$OUT/NOT-BOOTABLE.txt"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 300 \
            https://github.com/blacktop/ipsw/releases/download/v3.1.737/ipsw_3.1.737_macOS_universal.tar.gz \
            -o "$RUNNER_TEMP/ipsw.tar.gz"
          printf '%s  %s\n' a871dfbd55fef19dd433bb46964460c97fa9eeb4ee7ec8c5c29934209dc79c6e "$RUNNER_TEMP/ipsw.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ipsw.tar.gz" -C "$RUNNER_TEMP/ipsw-tools" ipsw
          echo "$RUNNER_TEMP/ipsw-tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ipsw-tools/ipsw" version > "$OUT/ipsw-version.txt"

      - name: Fetch matching stock inputs only
        run: |
          # Range extraction: do not download the entire 6.7 GB OTA.
          ipsw extract --remote \
            --pattern '^AssetData/(boot/BuildManifest\.plist|boot/kernelcache\.release\.iphone12|payload/replace/usr/standalone/update/ramdisk/arm64eSURamDisk\.dmg)$' \
            --output "$OUT/inputs" "$OTA_URL"
          raw=$(python3 tools/a13_ramdisk.py check "$OUT/inputs")
          if ! ipsw img4 im4p extract -o "$OUT/ramdisk.dmg" "$raw" > "$OUT/unwrap.log" 2>&1; then
            # OTA may already contain an unwrapped disk image. Mount must still validate it.
            cp "$raw" "$OUT/ramdisk.dmg"
          fi
          file "$raw" "$OUT/ramdisk.dmg" > "$OUT/image-types.txt"
          printf '%s  %s\n' "$STOCK_IMAGE_SHA256" "$OUT/ramdisk.dmg" | shasum -a 256 -c -

      - name: Build pinned native IMG4 helper and patch exact D431 kernel
        env:
          IM4M_B64: ${{ secrets.D431_T8030_IM4M_B64 }}
        run: |
          set -euo pipefail
          : "${IM4M_B64:?Set repository secret D431_T8030_IM4M_B64 to the base64-encoded T8030 IM4M}"
          printf '%s' "$IM4M_B64" | base64 -D > "$RUNNER_TEMP/d431-t8030.im4m"
          printf '%s  %s\n' 0389336c4d7091455d4c8edf52651915f8d8d2e57a5360e04007c51f14c9a35a "$RUNNER_TEMP/d431-t8030.im4m" | shasum -a 256 -c -
          kernel_im4p=$(find "$OUT/inputs" -name kernelcache.release.iphone12 -type f -print -quit)
          test -n "$kernel_im4p"
          printf '%s  %s\n' e860d85a8567c25ceaf90e1740c534375223d4b0929fb8523d9f4cfc01f72b76 "$kernel_im4p" | shasum -a 256 -c -
          ipsw img4 im4p extract -o "$OUT/kernelcache.stock.raw" "$kernel_im4p"
          python3 tools/a13_kernel_patch.py \
            "$OUT/kernelcache.stock.raw" "$OUT/kernelcache.patched.raw" "$OUT/kernelcache.bpatch"

          git clone --no-checkout https://github.com/xerub/img4lib.git "$RUNNER_TEMP/img4lib"
          git -C "$RUNNER_TEMP/img4lib" fetch --depth=1 origin 69772c72f3c08f021ec9fa4c386f2b3df60a38b7
          git -C "$RUNNER_TEMP/img4lib" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/img4lib" submodule update --init --recursive
          make -C "$RUNNER_TEMP/img4lib" COMMONCRYPTO=1
          test -x "$RUNNER_TEMP/img4lib/img4"
          "$RUNNER_TEMP/img4lib/img4" -h > "$OUT/img4-help.txt"

          "$RUNNER_TEMP/img4lib/img4" \
            -i "$kernel_im4p" -o "$OUT/KernelCache.img4.native" \
            -T rkrn -P "$OUT/kernelcache.bpatch" \
            -M "$RUNNER_TEMP/d431-t8030.im4m" -J
          python3 -m venv "$RUNNER_TEMP/pyimg4"
          "$RUNNER_TEMP/pyimg4/bin/pip" install --disable-pip-version-check pyimg4==0.8.8
          "$RUNNER_TEMP/pyimg4/bin/python" tools/a13_img4_verify.py \
            "$kernel_im4p" "$OUT/KernelCache.img4.native" \
            "$OUT/kernelcache.patched.raw" "$RUNNER_TEMP/d431-t8030.im4m"

      - name: Inspect runner-local image read-only
        run: |
          mountpoint=$(mktemp -d "$RUNNER_TEMP/d431-mount.XXXXXX")
          trap 'hdiutil detach "$mountpoint" || true; rmdir "$mountpoint" || true' EXIT
          # Prefer native DMG detection; flat APFS images need an explicit image class.
          image_options=()
          if ! hdiutil imageinfo "$OUT/ramdisk.dmg" > "$OUT/image-info.txt" 2>&1; then
            image_options=(-imagekey diskimage-class=CRawDiskImage)
          fi
          # This is a local file on an ephemeral runner, never a phone or host disk node.
          hdiutil attach -readonly -nobrowse -owners off "${image_options[@]}" \
            -mountpoint "$mountpoint" -plist "$OUT/ramdisk.dmg" > "$OUT/attach.plist" < /dev/null
          python3 tools/a13_ramdisk.py inspect "$mountpoint" "$OUT/inspection"
          hdiutil detach "$mountpoint"
          rmdir "$mountpoint"
          trap - EXIT

      - name: Compile and ad-hoc sign fixed UART probe
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=18.0 \
            -std=c11 -Os -Wall -Wextra -Werror tools/a13_uart_probe.c -o "$OUT/a13-uart-probe"
          codesign --force --sign - --timestamp=none \
            --entitlements tools/a13_uart_probe.entitlements "$OUT/a13-uart-probe"
          codesign --verify --strict "$OUT/a13-uart-probe"
          xcrun lipo "$OUT/a13-uart-probe" -verify_arch arm64
          codesign -d --verbose=4 "$OUT/a13-uart-probe" 2> "$OUT/probe-signature.txt"
          cp tools/a13_uart_probe.c tools/a13_uart_probe.entitlements "$OUT/"

      - name: Prepare separate runner-local UART image
        run: |
          candidate="$RUNNER_TEMP/uart-probe-working.dmg"
          cp "$OUT/ramdisk.dmg" "$candidate"
          mountpoint=$(mktemp -d "$RUNNER_TEMP/d431-probe.XXXXXX")
          trap 'hdiutil detach "$mountpoint" || true; rmdir "$mountpoint" || true' EXIT
          hdiutil attach -nobrowse -owners on -imagekey diskimage-class=CRawDiskImage \
            -mountpoint "$mountpoint" "$candidate" < /dev/null
          sudo "$(command -v python3)" tools/a13_ramdisk.py prepare "$mountpoint" "$OUT/a13-uart-probe" | tee "$OUT/uart-policy.txt"
          sudo "$(command -v python3)" tools/a13_ramdisk.py verify "$mountpoint" "$OUT/a13-uart-probe" | tee -a "$OUT/uart-policy.txt"
          sudo "$(command -v python3)" tools/a13_ramdisk.py inspect "$mountpoint" "$OUT/uart-inspection"
          hdiutil detach "$mountpoint"
          rmdir "$mountpoint"
          trap - EXIT
          printf '%s  %s\n' "$STOCK_IMAGE_SHA256" "$OUT/ramdisk.dmg" | shasum -a 256 -c -
          # Publish no partially modified image if preparation or detach failed.
          mv "$candidate" "$OUT/uart-probe.dmg"

      - name: Record artifact checksums and status
        if: ${{ always() }}
        run: |
          if [[ -d "$OUT" ]]; then
            checksums=$(mktemp "$RUNNER_TEMP/d431-sha256.XXXXXX")
            (cd "$OUT"; find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} +) > "$checksums"
            mv "$checksums" "$OUT/SHA256SUMS"
          fi
          printf '%s\n' \
            '## D431 / iOS 18.7.8 (22H352) UART candidate' \
            'Separate probe image disables stock launch jobs; stock image remains unchanged. Outputs may be partial on failure.' \
            '**Unbooted: the native-repacked patched kernel IMG4 is a packaging diagnostic only. D431 boot patches and trustcache integration still require validation. Do not boot or restore from this artifact.**' \
            'Fixed probe reports kernel/mounts and resolves APFS symbols without calling them.' \
            'No phone access, SEP commands, or NVRAM changes. Kernel patch bytes and native IMG4 wrapping were verified against pinned source hashes.' \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: d431-18.7.8-22H352-uart-probe-${{ github.run_number }}
          path: build/a13-ramdisk/
          retention-days: 1
          if-no-files-found: error
